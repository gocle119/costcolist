<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E31837">
  <title>CostcoList</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div style="min-width:0; flex:1;">
      <h1>Costco<span>List</span></h1>
      <div id="list-name-header" style="display:none;"></div>
    </div>
    <div class="header-right">
      <div id="code-badge" class="code-badge" style="display:none;"></div>
      <button id="share-btn" class="btn btn-ghost" style="display:none;">Share</button>
    </div>
  </header>

  <div class="page">
    <div id="loading-state" style="text-align:center; padding:60px 20px; color:var(--muted);">
      <div class="spinner" style="border-color:rgba(0,0,0,0.15); border-top-color:var(--red); width:32px; height:32px; border-width:3px;"></div>
      <p style="margin-top:12px;">Loading list…</p>
    </div>

    <div id="error-state" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:2.5rem; margin-bottom:12px;">🛒</div>
      <h2 style="color:var(--red); margin-bottom:8px;">List not found</h2>
      <p style="color:var(--muted); margin-bottom:24px;">This code doesn't match any list. Double-check and try again.</p>
      <a href="/" class="btn btn-red">Go Home</a>
    </div>

    <div id="main-state" style="display:none;">
      <div id="items-container" class="items-container"></div>

      <div id="add-form-container">
        <h3>Add item</h3>
        <div class="field-group">
          <label>Item name *</label>
          <input id="add-name" class="input" type="text" placeholder="e.g. Kirkland Olive Oil" maxlength="200" autocomplete="off">
        </div>
        <div class="input-row">
          <div class="field-group" style="flex:1;">
            <label>Quantity</label>
            <input id="add-qty" class="input" type="text" placeholder="1" maxlength="30">
          </div>
          <div class="field-group" style="flex:2;">
            <label>Notes (optional)</label>
            <input id="add-notes" class="input" type="text" placeholder="e.g. the big jug" maxlength="200" autocomplete="off">
          </div>
        </div>
        <div class="edit-actions">
          <button id="add-cancel-btn" class="btn btn-sm" style="background:var(--bg); color:var(--text);">Cancel</button>
          <button id="add-submit-btn" class="btn btn-red btn-sm">Add Item</button>
        </div>
        <p class="error-msg" id="add-error"></p>
      </div>

      <div class="status-bar" id="status-bar"></div>
    </div>
  </div>

  <button id="fab" title="Add item">+</button>

  <!-- Share overlay -->
  <div id="share-overlay" class="overlay-backdrop" style="display:none;">
    <div class="share-sheet">
      <h3>Share this list</h3>
      <div class="share-row">
        <label>Code</label>
        <div class="share-value" id="share-code-val"></div>
        <button class="btn btn-sm btn-blue" onclick="copyText('code')">Copy</button>
      </div>
      <div class="share-row">
        <label>URL</label>
        <div class="share-value" id="share-url-val" style="font-size:0.78rem;"></div>
        <button class="btn btn-sm btn-blue" onclick="copyText('url')">Copy</button>
      </div>
      <p style="font-size:0.82rem; color:var(--muted); margin-top:10px;">Anyone with the code or URL can view and edit this list.</p>
      <button class="btn btn-red share-close" onclick="closeShare()">Done</button>
    </div>
  </div>

  <script src="/js/list.js"></script>
</body>
</html>
